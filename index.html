<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guojiaxuan</title>
  <link rel="icon" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <style>
.stage, .stage * { box-sizing: border-box; }
.stage {
  position: relative;
  width: 90vw;
  max-width: 650px;
  height: 320px;
  margin: 40px auto 0; /* space above the stage */
}
.road {
  position: absolute;
  bottom: 90px;
  width: 100%;
  height: 8px;
  background: #777;
  border-radius: 4px;
}
.car {
  position: absolute;
  bottom: 98px;
  left: 80px;
  width: 150px;
  height: 60px;
  cursor: pointer;
}
.car-body {
  position: absolute;
  bottom: 18px;
  left: 8px;
  width: 130px;
  height: 36px;
  background: #ff3b30;
  border-radius: 10px;
}
.car-top {
  position: absolute;
  bottom: 48px;
  left: 36px;
  width: 76px;
  height: 20px;
  background: #ff3b30;
  border-radius: 8px 8px 0 0;
}
.window {
  position: absolute;
  bottom: 50px;
  left: 42px;
  width: 64px;
  height: 14px;
  background: #b8e1ff;
  border-radius: 3px;
}
.light {
  position: absolute;
  bottom: 28px;
  right: 8px;
  width: 10px;
  height: 12px;
  background: #fff9c4;
  border-radius: 3px;
}
.wheel {
  position: absolute;
  bottom: 0;
  width: 34px;
  height: 34px;
  background: #222;
  border-radius: 50%;
  border: 4px solid #444;
}
.wheel::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 9px;
  height: 9px;
  background: #aaa;
  border-radius: 50%;
}
.wheel-back {
  left: 16px;
}
.wheel-front {
  right: 16px;
}
.car.go-forward .wheel {
  animation: spinForward 0.3s linear infinite;
}
@keyframes spinForward {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.car.go-back .wheel {
  animation: spinBack 0.3s linear infinite;
}
@keyframes spinBack {
  from { transform: rotate(0deg); }
  to { transform: rotate(-360deg); }
}
.tip {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-size: 16px;
  color: #224;
}
/* 首页两张照片：宽屏并排，窄屏上下堆叠 */
.photos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 1.5rem;
}
.photos img {
  width: 100%;
  height: 22rem;
  object-fit: cover;
  border-radius: 10px;
}
@media (max-width: 640px) {
  .photos { grid-template-columns: 1fr; }
  .photos img { height: 16rem; }
}
</style>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="hero">
      <div class="photos">
        <img src="Images/sunset-peaks.jpg" alt="Sunset light on snow-covered peaks above a sea of clouds">
        <img src="Images/alpine-lake.jpg" alt="Turquoise alpine lake ringed by cliffs and pine forest">
      </div>
      <h1>Guojiaxuan</h1>
      <p>Computer Science at BiUH — and a website written entirely by hand.</p >
    </section>

    <h2>On this site</h2>
    <ul>
      <li><a href="quote.html">Quotes</a > — things worth reading twice</li>
      <li><a href="project.html">Project ideas</a > — what I might build, and for whom</li>
      <li><a href="about.html">About and contact</a > — who I am, and how to reach me</li>
    </ul>
    
    <div class="stage">
      <div class="road"></div>
      <div class="car" id="car" role="button" tabindex="0" aria-label="Click the car">
        <div class="car-top"></div>
        <div class="window"></div>
        <div class="car-body"></div>
        <div class="light"></div>
        <div class="wheel wheel-back"></div>
        <div class="wheel wheel-front"></div>
      </div>
      <div class="tip" id="tipText">Click the car</div>
    </div>
  
  </main>

  <footer id="site-footer"></footer>

  <script src="nav.js"></script>

  <script>
const car = document.getElementById("car");
const tipText = document.getElementById("tipText");
const stage = document.querySelector(".stage");

const startPos = 80;
const step = 70;
const carWidth = 150;          /* .car width, from the CSS above */
const forwardDuration = 600;
const backSpeed = 0.8;

let pos = startPos;
let running = false;
let maxPos = 450;

function update() {
  car.style.left = pos + "px";
}

/* the road is as wide as the stage, so work out where the car must stop */
function measure() {
  const width = stage.clientWidth || stage.offsetWidth;
  maxPos = Math.max(startPos, width - carWidth - 16);
  if (pos > maxPos) {
    pos = maxPos;
    update();
  }
}

window.addEventListener("resize", measure);

function goForward() {
  return new Promise(resolve => {
    const from = pos;
    const to = Math.min(from + step, maxPos);
    const startTime = performance.now();
    car.classList.add("go-forward");

    function animate(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / forwardDuration, 1);
      pos = from + (to - from) * progress;
      update();
      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        car.classList.remove("go-forward");
        resolve();
      }
    }
    requestAnimationFrame(animate);
  });
}

function goBack() {
  return new Promise(resolve => {
    car.classList.add("go-back");
    function back() {
      pos -= backSpeed;
      if (pos <= startPos) {
        pos = startPos;
        update();
        car.classList.remove("go-back");
        resolve();
        return;
      }
      update();
      requestAnimationFrame(back);
    }
    back();
  });
}

car.addEventListener("click", async () => {
  if (running) return;
  running = true;
  tipText.textContent = "This car doesn't seem to listen to you";
  await goForward();
  await goBack();
  running = false;
});

measure();
car.addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    car.click();
  }
});

update();
</script>
</body>
</html>
